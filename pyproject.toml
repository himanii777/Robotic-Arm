[project]
name = "robotic-arm-hand-tracking"
version = "0.1.0"
description = "Webcam hand-tracking prototype for robotic arm visualization and control."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "bleak>=0.22.3",
    "mediapipe==0.10.9",
    "numpy==1.26.4",
    "opencv-contrib-python>=4.8.0",
    "matplotlib>=3.7.0",
    "sounddevice>=0.4.6",
    "pybricksdev>=1.0.0",
]

[tool.uv]
package = false
